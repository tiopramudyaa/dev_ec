server {
    # Port di dalam container
    listen 80;
    # Terima semua nama domain
    server_name _;
    # Folder public Laravel sebagai root website
    root /var/www/html/public;
    # File default yang dibuka
    index index.php;
    # Batas ukuran upload, samakan dengan post_max_size PHP
    client_max_body_size 25M;

    # Semua request URL
    location / {
        # Kirim file kalau ada, kalau tidak teruskan ke Laravel
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Request ke file .php
    location ~ \.php$ {
        # Teruskan ke PHP-FPM di container jarvies-app
        fastcgi_pass jarvies-app:9000;
        # Parameter standar FastCGI
        include fastcgi_params;
        # Path lengkap file PHP yang dijalankan
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Waktu tunggu respons PHP (request lama, mis. panggilan AI)
        fastcgi_read_timeout 120s;
    }

    # Tolak akses ke file tersembunyi (.env, .git, dll)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
