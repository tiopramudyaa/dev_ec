# Nama project compose
name: mysql

services:
  mysql:
    # Image resmi MySQL 8.0
    # Image MySQL 8.0 + script init (docker/mysql.Dockerfile)
    build:
      context: ./docker
      dockerfile: mysql.Dockerfile
    image: eco-mysql
    # Nama container, dipakai sebagai DB_HOST di .env Laravel
    container_name: mysql
    # Izinkan migrasi membuat trigger/function tanpa hak SUPER
    # (binary log aktif secara default di MySQL 8 -> error 1419)
    command: --log-bin-trust-function-creators=1
    # Password, nama database & user diambil dari .env.mysql
    env_file: .env.mysql
    ports:
      # port host:port container (akses MySQL dari luar Docker).
      # Host 3306 sudah dipakai MySQL server, jadi pakai 3307 & hanya
      # localhost (akses dari luar lewat SSH tunnel). App tetap pakai mysql:3306
      - "127.0.0.1:3307:3306"
    volumes:
      # Data database disimpan di volume agar tidak hilang
      - mysql_data:/var/lib/mysql
    # Hidup lagi otomatis kalau crash / server reboot
    restart: unless-stopped
    networks:
      # Network bersama dengan EcoSystem & JARVIES
      - shared_db
      # Network container workspace (SSH port 2222), agar Navicat bisa
      # SSH tunnel ke mysql:3306. Host memblokir container -> port host
      - staging

  # Penerus port untuk Navicat: sshd workspace hanya mengizinkan tunnel ke
  # localhost (PermitOpen), jadi buka 127.0.0.1:3307 DI DALAM workspace
  # (berbagi network dengan container workspace) -> mysql:3306.
  # Navicat: SSH ke port 2222, lalu host 127.0.0.1 port 3307
  mysql-tunnel:
    image: alpine/socat
    container_name: mysql-tunnel
    network_mode: "container:eclectic-staging-workspace"
    command: TCP-LISTEN:3307,bind=127.0.0.1,fork,reuseaddr TCP:mysql:3306
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  shared_db:
    # Nama tetap agar bisa dipakai compose lain
    name: shared_db
  staging:
    # Dibuat oleh devops (container eclectic-staging-workspace)
    name: eclectic-staging_staging
    external: true
